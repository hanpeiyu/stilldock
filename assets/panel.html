<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>StillDock · 原帧</title>
<style>
:root{font-family:'Segoe UI','Microsoft YaHei',sans-serif;color:#dedee4;background:#18181b;font-size:13px}*{box-sizing:border-box}body{margin:0;height:100vh;overflow:hidden}button,input,select{font:inherit}button{cursor:pointer;border:1px solid #3b3b42;border-radius:7px;background:transparent;color:#bdbdc6;padding:7px 10px;font-size:11px}button:hover{background:#303037}button:disabled{opacity:.4;cursor:default}button:focus-visible,input:focus-visible{outline:2px solid #fa4466;outline-offset:-2px}#rail{position:fixed;right:7px;top:10px;width:30px;height:32px;padding:0;z-index:5;font-size:18px}main{height:100vh;display:flex;flex-direction:column;padding:24px 18px 14px}body.collapsed main{display:none}header{font-size:20px;font-weight:650;margin:0 0 22px}header small{display:block;font-size:10px;font-weight:400;color:#85858f;margin-top:5px}.nav,.tabs,.bulk,.row{display:flex;gap:6px}.nav{padding-bottom:15px;border-bottom:1px solid #303036}.tabs{margin:14px 0;background:#25252a;border-radius:7px;padding:3px}.tabs button{flex:1;border:0}.tabs button.active{background:#3c3c43;color:white}.page{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;scrollbar-width:thin;scrollbar-color:#555560 transparent}.label{font-size:10px;color:#90909a;margin:15px 0 12px}.note{padding:2px 0 18px;border-bottom:1px solid #303036}#title{font-size:15px;line-height:1.7;margin:10px 0;overflow-wrap:anywhere}#author{font-size:11px;color:#91919b}#download{width:100%;background:#ed3253;color:white;border:0;height:42px;font-weight:600;margin-top:16px}.empty{padding:25px 0;color:#898995;font-size:12px;text-align:center;line-height:1.9}.bulk{flex-wrap:wrap;margin:12px 0}.bulk button{font-size:10px;padding:5px 7px}.job{padding:15px 0;border-bottom:1px solid #303036}.job-title{font-size:12px;font-weight:600;line-height:1.7;overflow-wrap:anywhere}.state{color:#a6b49c;font-size:10px;margin:6px 0}.detail{font-size:10px;color:#8f8f9b;line-height:1.8;overflow-wrap:anywhere}.actions{display:flex;gap:5px;flex-wrap:wrap;margin-top:9px}.actions button{font-size:10px;padding:4px 7px}.bar{height:3px;border-radius:4px;background:#303036;margin:8px 0}.bar>span{display:block;height:100%;background:#df4b66;transition:width .2s}footer{padding-top:12px;border-top:1px solid #303036}footer button{width:100%}#toast{position:fixed;bottom:20px;left:12px;right:12px;background:#41414c;padding:13px;border-radius:9px;font-size:12px;z-index:10;line-height:1.8}input[type=search]:focus{border-color:#fa4466;box-shadow:inset 0 0 0 1px #fa4466;outline:none}input[type=search]{width:100%;padding:10px;background:#242429;color:#ddd;border:1px solid #3b3b42;border-radius:7px}.path{padding:12px;background:#25252a;border-radius:7px;color:#aaaab5;font-size:11px;overflow-wrap:anywhere;margin:14px 0}label{display:block;margin:18px 0;font-size:12px}small{color:#8a8a95;font-size:10px;line-height:1.8}dialog{background:#222228;color:#ddd;border:1px solid #454550;border-radius:12px;width:calc(100% - 24px);max-width:320px;padding:20px}dialog::backdrop{background:#0008}dialog button{width:100%;margin-top:11px}select{background:#25252a;color:#ddd;border:1px solid #414149;border-radius:6px;padding:7px}.pick{padding:7px 0;color:#aaa;font-size:11px}#asset-picks{max-height:140px;overflow:auto;display:flex;gap:7px;flex-wrap:wrap}#asset-picks label{margin:4px 0;font-size:10px}textarea{width:100%;background:#25252a;color:#ddd;border:1px solid #444;border-radius:6px;padding:9px} [hidden]{display:none!important}@media(max-height:720px){main{padding-top:16px}header{margin-bottom:12px}.label{margin-top:9px}.note{padding-bottom:12px}}

main{border-left:1px solid #2b2b30}header{padding-right:28px}.page{padding:3px 6px 3px 3px;scrollbar-gutter:stable}.page::-webkit-scrollbar,#asset-picks::-webkit-scrollbar{width:5px}.page::-webkit-scrollbar-thumb,#asset-picks::-webkit-scrollbar-thumb{background:#47474f;border-radius:5px}.page::-webkit-scrollbar-thumb:hover{background:#656570}.pick:has(#pick-toggle[hidden]){display:none}.pick label{margin:8px 0}#title{display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.nav button{flex:1}.job-title{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.detail{color:#aaaab5}.state{font-size:11px}.actions button{min-height:28px}input[type=checkbox]{accent-color:#ed3253;vertical-align:middle}.bar{overflow:hidden}#rail{background:#222226}.tabs button{min-height:31px}.label{letter-spacing:.5px}#toast{pointer-events:none}@media(max-width:300px){main{padding-left:12px;padding-right:12px}.nav{gap:3px}.nav button{padding:7px 5px}}

#asset-picks{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;max-height:270px;padding:3px 6px 3px 2px;scrollbar-width:thin}.thumb{position:relative;min-width:0}.thumb label{display:block;position:relative;margin:0!important;border:2px solid #414149;border-radius:8px;overflow:hidden;cursor:pointer;background:#25252a;aspect-ratio:1}.thumb label:has(input:checked){border-color:#ed3253}.thumb img{display:block;width:100%;height:100%;object-fit:cover}.thumb input{position:absolute;left:3px;top:3px;z-index:1;margin:0;width:16px;height:16px}.thumb .number{position:absolute;right:3px;top:3px;border-radius:4px;background:#0009;color:#fff;padding:1px 5px;font-size:10px}.thumb .zoom{position:absolute;bottom:4px;right:4px;background:#18181bd9;color:#fff;padding:2px 6px;font-size:10px;min-height:24px}.thumb .error{font-size:10px;position:absolute;left:4px;bottom:7px;color:#bbb;pointer-events:none}.pick-tools{display:flex;align-items:center;gap:6px;margin:8px 0}.pick-tools button{padding:4px 7px}.pick-tools small{margin-left:auto}#preview{max-width:calc(100vw - 20px);padding:10px}#preview img{display:block;width:100%;max-height:65vh;object-fit:contain;background:#18181b}#preview h3{margin:4px 0 10px;font-size:13px}

.quality{font-size:10px;color:#aaaab5;line-height:1.8;margin-top:8px}#live-option{margin:12px 0 0;font-size:11px;line-height:1.8}.live-badge{position:absolute;bottom:4px;left:4px;border-radius:4px;padding:1px 4px;background:#18181bdd;color:#fff;font-size:9px;font-weight:600}.thumb .zoom{bottom:24px}.thumb-size{display:block;white-space:nowrap;text-align:center;font-size:9px;overflow:hidden;text-overflow:ellipsis;margin-top:3px;color:#a5a5af}
</style>
<body class="collapsed"><button id="rail" title="展开下载栏" aria-label="展开下载栏">☰</button><main><header>原帧 <small>StillDock · 高清无水印素材下载</small></header><div class="nav"><button data-nav="back">←</button><button data-nav="forward">→</button><button data-nav="reload">刷新</button><button data-nav="home">首页</button></div><div class="tabs"><button data-tab="downloads" class="active">下载</button><button data-tab="history">历史</button><button data-tab="settings">设置</button></div>
<section id="downloads" class="page"><div class="label">当前笔记</div><div class="note"><div id="title">在左侧搜索并打开一篇笔记</div><div id="author"></div><div id="quality" class="quality"></div><label id="live-option" hidden><input id="include-live" type="checkbox"> 同时保存 LIVE 动态片段</label><div class="pick"><label id="pick-toggle" hidden><input id="pick-some" type="checkbox"> 选择部分图片</label><div id="pick-tools" class="pick-tools" hidden><button id="select-all">全选</button><button id="select-none">清空</button><small id="pick-count"></small></div><div id="asset-picks" hidden></div></div><button id="download" disabled>下载当前笔记</button></div><div class="label">下载队列</div><div class="bulk"><button data-bulk="pause_all">全部暂停</button><button data-bulk="resume_all">继续未完成</button><button id="paste">粘贴链接</button></div><div id="jobs"></div></section>
<section id="history" class="page" hidden><div class="label">下载历史</div><input id="search" type="search" placeholder="搜索标题或作者"><div id="history-jobs"></div></section>
<section id="settings" class="page" hidden><div class="label">保存目录</div><div class="path" id="path"></div><button id="choose">选择文件夹</button><p><small>新任务使用新目录。暂停恢复沿用原目录；不会移动已有文件。</small></p><label><input id="focus" type="checkbox" checked> 素材专注模式</label><label><input id="ai" type="checkbox" checked> 屏蔽点点 AI</label><label><input id="comments" type="checkbox" checked> 默认折叠评论</label><button id="original">显示原网页</button><p><small>原网页模式可关闭所有网页改造。登录会话仅保存在本机浏览器目录中。</small></p><div class="label">关于</div><small id="about"></small></section>
<footer><button id="folder">打开下载目录 ↗</button></footer></main><div id="toast" role="status" hidden></div><dialog id="exit"><h3>还有任务未完成</h3><small>暂停后保留下载进度，下次可继续。</small><button data-exit="pause_exit">暂停并退出</button><button data-exit="finish_exit">处理完队列后退出</button><button data-exit="stay">继续使用</button></dialog><dialog id="link"><h3>打开笔记链接</h3><textarea id="url" rows="4" placeholder="粘贴完整的小红书笔记链接"></textarea><button id="open-link">在浏览器打开</button><button id="close-link">返回</button></dialog>
<dialog id="preview"><h3 id="preview-title"></h3><img id="preview-image" alt="图片预览"><button id="close-preview">关闭预览</button></dialog>
<script>
const $=id=>document.getElementById(id),send=(action,extra={})=>window.ipc.postMessage(JSON.stringify({action,...extra}));
let current={},jobs=[],tab='downloads',toastTimer,original=false,lastNote='',ready=false;
const labels={pending:'排队中',running:'下载中',pausing:'正在暂停',paused:'已暂停',cancelling:'正在取消',cancelled:'已取消',done:'已完成',failed:'失败'};
const mb=n=>(n/1048576).toFixed(1)+' MB';
function toast(text){$('toast').textContent=text;$('toast').hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').hidden=true,4000)}
function picks(){const selected=$('pick-some').checked?[...$('asset-picks').querySelectorAll('input:checked')].map(i=>Number(i.value)):null;return selected}
function renderJobs(container,list){const old=new Map([...container.querySelectorAll('.job')].map(e=>[e.dataset.id,e]));const wanted=new Set(list.map(j=>j.id));for(const e of [...container.children])if(!wanted.has(e.dataset.id))e.remove();list.forEach((j,index)=>{let e=old.get(j.id);if(!e){e=document.createElement('article');e.className='job';e.dataset.id=j.id;e.innerHTML='<div class="job-title"></div><div class="state"></div><div class="bar"><span></span></div><div class="detail"></div><div class="actions"></div>'}e.querySelector('.job-title').textContent=j.title;e.querySelector('.state').textContent=labels[j.state]||j.state;e.querySelector('.bar span').style.width=(j.state==='done'?100:j.total?Math.min(100,j.done/j.total*100):0)+'%';e.querySelector('.detail').textContent=j.state==='running'?(j.message+' · '+mb(j.done)+(j.total?' / '+mb(j.total):'')):j.message;if(e.dataset.state!==j.state){e.dataset.state=j.state;const actions=e.querySelector('.actions');actions.replaceChildren();const button=(label,action)=>{let b=document.createElement('button');b.textContent=label;b.onclick=()=>send(action,{id:j.id});actions.append(b)};if(['pending','running'].includes(j.state))button('暂停','pause');if(['paused','failed'].includes(j.state))button('继续','resume');if(['pending','running','paused','failed'].includes(j.state))button('取消','cancel');button('打开目录','open_job');button('查看笔记','open_note')}if(container.children[index]!==e)container.insertBefore(e,container.children[index]||null)});if(!list.length){let e=document.createElement('div');e.className='empty';e.textContent='还没有相关下载记录';container.replaceChildren(e)}}
function updateCount(){const inputs=[...$('asset-picks').querySelectorAll('input')];$('pick-count').textContent='已选 '+inputs.filter(i=>i.checked).length+' / '+inputs.length;}
function loadThumbnails(){for(const img of $('asset-picks').querySelectorAll('img[data-src]')){img.src=img.dataset.src;img.removeAttribute('data-src');}}
function closePreview(){$('preview').close();$('preview-image').removeAttribute('src');}
function showTab(name){tab=name;for(const key of ['downloads','history','settings'])$(key).hidden=key!==name;document.querySelectorAll('[data-tab]').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));}
function render(){let live=jobs.filter(j=>!['done','cancelled'].includes(j.state)).concat(jobs.filter(j=>['done','cancelled'].includes(j.state)).slice(0,3));renderJobs($('jobs'),live);const q=$('search').value.toLowerCase();renderJobs($('history-jobs'),jobs.filter(j=>(j.title+' '+j.author).toLowerCase().includes(q)));$('title').textContent=current.title||'在左侧搜索并打开一篇笔记';$('author').textContent=current.author?'@ '+current.author:'';const images=(current.assets||[]).filter(a=>!a.video),liveCount=images.filter(a=>a.live_url).length;$('live-option').hidden=!liveCount;$('quality').textContent=images.length?(images.some(a=>a.original_url)?'优先高清源 · 下载后校验分辨率':'网页图片 · 高清源待确认')+(liveCount?' · '+liveCount+' 张 LIVE':''):(current.assets?.some(a=>a.video)?'网页可用视频流':'');let active=jobs.find(j=>j.note_id===current.id&&['pending','running','pausing','cancelling'].includes(j.state));$('download').disabled=!current.id||!!active;$('download').textContent=active?'已加入队列':(jobs.some(j=>j.note_id===current.id&&j.state==='done')?'再次下载 / 补选图片':'下载当前笔记');const signature=current.id+JSON.stringify(current.assets);if(signature!==lastNote){lastNote=signature;$('pick-some').checked=false;$('include-live').checked=false;$('asset-picks').hidden=true;$('asset-picks').replaceChildren();$('pick-toggle').hidden=!(current.assets?.length>1&&!current.assets.some(a=>a.video));$('pick-tools').hidden=true;
(current.assets||[]).forEach((a,i)=>{
  if(a.video)return;
  const card=document.createElement('div'),label=document.createElement('label'),input=document.createElement('input'),img=document.createElement('img'),number=document.createElement('span'),zoom=document.createElement('button');
  card.className='thumb';input.type='checkbox';input.value=i;input.checked=true;input.setAttribute('aria-label','选择图片 '+(i+1));input.onchange=updateCount;
  img.dataset.src=a.preview||a.url;img.loading='lazy';img.decoding='async';img.referrerPolicy='no-referrer';img.alt='图片 '+(i+1);img.onerror=()=>{img.hidden=true;const error=document.createElement('span');error.className='error';error.textContent='预览暂不可用';label.append(error);};
  number.className='number';number.textContent=i+1;label.append(input,img,number);
  if(a.live_url){const badge=document.createElement('span');badge.className='live-badge';badge.textContent='LIVE';label.append(badge);}
  const caption=document.createElement('small');caption.className='thumb-size';caption.title='网页标注尺寸，实际尺寸以下载报告为准';caption.textContent=a.width&&a.height?a.width+'×'+a.height:'尺寸下载后确认';
  zoom.className='zoom';zoom.textContent='放大';zoom.setAttribute('aria-label','放大图片 '+(i+1));zoom.onclick=()=>{$('preview-title').textContent='图片 '+(i+1);$('preview-image').src=a.url;$('preview').showModal();};
  card.append(label,zoom,caption);$('asset-picks').append(card);
});updateCount();closePreview();}}window.receive=data=>{if(data.kind==='snapshot'){jobs=data.jobs;current=data.note||{};document.body.classList.toggle('collapsed',data.collapsed);$('rail').textContent=data.collapsed?'☰':'›';$('rail').title=data.collapsed?'展开下载栏':'收起下载栏';$('rail').setAttribute('aria-label',$('rail').title);$('path').textContent=data.folder;original=data.original;$('original').textContent=original?'恢复素材模式':'显示原网页';$('focus').checked=data.focus;$('ai').checked=data.ai;$('comments').checked=data.comments;$('about').textContent=data.about;render()}else if(data.kind==='current_note'){showTab('downloads');$('downloads').scrollTop=0;}else if(data.kind==='toast')toast(data.message);else if(data.kind==='close'){$('exit').showModal()}};
$('rail').onclick=()=>send('toggle');$('download').onclick=()=>{const selected=picks();if(selected&&selected.length===0){toast('至少选择一张图片');return}$('download').disabled=true;toast('正在读取当前笔记…');send('download',{indices:selected,include_live:$('include-live').checked,note_id:current.id,expected_urls:(current.assets||[]).map(a=>a.url)})};$('pick-some').onchange=()=>{const show=$('pick-some').checked;$('asset-picks').hidden=!show;$('pick-tools').hidden=!show;if(show)loadThumbnails();};$('select-all').onclick=()=>{for(const input of $('asset-picks').querySelectorAll('input'))input.checked=true;updateCount();};$('select-none').onclick=()=>{for(const input of $('asset-picks').querySelectorAll('input'))input.checked=false;updateCount();};$('close-preview').onclick=closePreview;$('preview').addEventListener('close',()=>$('preview-image').removeAttribute('src'));$('folder').onclick=()=>send('open_folder');$('choose').onclick=()=>send('choose_folder');$('search').oninput=render;document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>send(b.dataset.nav));document.querySelectorAll('[data-bulk]').forEach(b=>b.onclick=()=>send(b.dataset.bulk));document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{showTab(b.dataset.tab)});for(const key of ['focus','ai','comments'])$(key).onchange=()=>send('setting',{key,value:$(key).checked});$('original').onclick=()=>send('setting',{key:'original',value:!original});document.querySelectorAll('[data-exit]').forEach(b=>b.onclick=()=>{$('exit').close();send(b.dataset.exit)});$('paste').onclick=()=>$('link').showModal();$('close-link').onclick=()=>$('link').close();$('open-link').onclick=()=>{send('link',{url:$('url').value});$('link').close()};send('ready');
</script></body></html>
