[package]
name = "xhs-browser"
version = "0.3.0"
edition = "2021"
license = "GPL-3.0-only"
description = "StillDock: high-resolution Xiaohongshu images and Live media for Windows"
repository = "https://github.com/hanpeiyu/stilldock"
readme = "README.md"

[dependencies]
wry = "=0.57.1"
tao = "=0.37.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt", "time", "net", "sync", "fs", "io-util", "macros"] }
url = "2"
rfd = { version = "0.15", default-features = false }
fs2 = "0.4"
imagesize = "0.14"

[build-dependencies]
winresource = "0.1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
