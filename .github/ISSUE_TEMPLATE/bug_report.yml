name: 问题反馈
description: 报告界面、下载或启动问题
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: 请勿上传 Cookie、浏览器数据目录、数据库或含令牌的完整链接。
  - type: input
    id: version
    attributes:
      label: 拾光版本
      placeholder: v0.1.3
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Windows / WebView2 版本及显示缩放
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 重现步骤、期望和实际结果
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: 脱敏截图（可选）
